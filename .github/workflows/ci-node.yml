name: CI api-node

on:
  pull_request:
    branches: [main, development]
  push:
    branches: [main, development]

jobs:
  test:
    name: test-node
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api-node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
