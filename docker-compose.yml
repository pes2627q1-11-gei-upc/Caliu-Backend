services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-node:
    build: ./apps/api-node
    restart: unless-stopped
    environment:
      PORT: 3000
      # Base de dades de l'API: per defecte el Mongo local d'aquest compose. Per usar la d'Atlas (on el trigger
      # omple la col·lecció `esdeveniments`) definiu API_MONGO_URI al .env, amb el nom de BD: .../Caliu?...
      MONGO_URI: ${API_MONGO_URI:-mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/${MONGO_DB}?authSource=admin}
      JWT_SECRET: ${JWT_SECRET}
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-3600}
      PYTHON_SERVICE_URL: ${PYTHON_SERVICE_URL}
      PYTHON_TIMEOUT_MS: ${PYTHON_TIMEOUT_MS:-60000}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    ports:
      - "${NODE_PORT:-3000}:3000"
    depends_on:
      mongo:
        condition: service_healthy

  python-service:
    build: ./apps/python-service
    restart: unless-stopped
    environment:
      MONGO_URI: ${API_MONGO_URI:-mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/${MONGO_DB}?authSource=admin}
      MONGO_DATABASE: ${MONGO_DATABASE:-${MONGO_DB:-caliu}}
      APP_ENV: ${APP_ENV:-production}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
    # Servei intern sense autenticació pròpia: no publicar el port ni eliminar
    # l'aïllament de xarxa; només api-node hi ha d'accedir.
    expose:
      - "8000"
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data:
