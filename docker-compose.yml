services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-node:
    build: ./apps/api-node
    restart: unless-stopped
    environment:
      PORT: 3000
      MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/${MONGO_DB}?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
      PYTHON_SERVICE_URL: ${PYTHON_SERVICE_URL}
    ports:
      - "${NODE_PORT:-3000}:3000"
    depends_on:
      mongo:
        condition: service_healthy

  python-service:
    build: ./apps/python-service
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/${MONGO_DB}?authSource=admin
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      # Ingesta: on són les dades obertes ja carregades a Mongo (vegeu app/ingest)
      SOURCE_MONGO_URI: ${SOURCE_MONGO_URI:-}
      SOURCE_DB: ${SOURCE_DB:-}
      SOURCE_COLLECTION: ${SOURCE_COLLECTION:-}
    # Servei intern: NO es publica cap port a l'exterior.
    # Només api-node hi accedeix, per la xarxa de Docker.
    expose:
      - "8000"
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data:
