openapi: 3.0.3
info:
  title: Caliu API
  version: 0.1.0
  description: |
    API REST de Caliu (api-node). Contracte compartit amb el frontend.
    - Les dates són ISO 8601 (si envieu zona horària, p. ex. +02:00, el filtre és exacte).
    - Les coordenades van en ordre [longitud, latitud] (GeoJSON).
    - Tots els errors tenen el format { "error": "missatge" }.
servers:
  - url: http://localhost:3000
    description: "Local (Docker Compose). Des de l'emulador Android: http://10.0.2.2:3000"

paths:
  /users/{id}/follow:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    post:
      summary: Segueix un usuari
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Operació completada (idempotent) }
        '400': { description: Id invàlid o usuari propi }
        '401': { description: Sessió no vàlida }
        '404': { description: Usuari no trobat }
    delete:
      summary: Deixa de seguir un usuari
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Operació completada (idempotent) }
        '400': { description: Id invàlid o usuari propi }
        '401': { description: Sessió no vàlida }
        '404': { description: Usuari no trobat }
  /achievements:
    get:
      summary: Catàleg i progrés de l'usuari autenticat
      security: [{ bearerAuth: [] }]
      responses:
        '401': { description: Sessió no vàlida }
        '200':
          description: Catàleg amb el progrés real del compte
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, title, description, icon, target, progress, unlocked]
                      properties:
                        id: { type: string }
                        title: { type: string }
                        description: { type: string }
                        icon: { type: string }
                        target: { type: integer, minimum: 1 }
                        progress: { type: integer, minimum: 0 }
                        unlocked: { type: boolean }
  /health:
    get:
      summary: Comprova que el servei funciona
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  service: { type: string, example: api-node }

  /chat/messages:
    post:
      summary: Envia un missatge al xatbot
      description: |
        Crea una sessió de xat nova si no s'envia `sessionId`. La sessió existent
        ha de pertànyer a l'usuari autenticat. Envia al model els últims deu missatges
        de la sessió (màxim 1000 caràcters per missatge) com a context. Desa el missatge
        i la resposta només si Python respon.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, minLength: 1, maxLength: 500 }
                sessionId: { type: string, example: "6710f1c2a1b2c3d4e5f60718" }
                locale:
                  type: string
                  enum: [ca, es, en]
                  description: |
                    Idioma de l'app. Només s'usa quan no es pot detectar l'idioma del missatge
                    ni dels anteriors (p. ex. "ok" o "Girona"); l'idioma del missatge té prioritat.
      responses:
        '200':
          description: |
            Resposta del xatbot. `type` és `text` per a una resposta normal o `plan` quan l'usuari
            demana un itinerari: llavors `plan` conté els passos encadenats, ordenats per hora i distància,
            que l'app mostra amb el widget d'itinerari. `reply` sempre porta el text (també el del pla).
            `fallback` vol dir que el model d'IA no ha respost després dels reintents: `reply` és un missatge
            alternatiu (amb algunes activitats, si n'hi ha) i la conversa no es desa a l'historial, de manera
            que l'app pot oferir tornar a enviar el mateix missatge (a la mateixa sessió, o sense `sessionId`
            si era una conversa nova).
            Si no hi ha resultats per als criteris, `reply` ho diu i proposa alternatives més generals.
          content:
            application/json:
              schema:
                type: object
                required: [sessionId, type, reply, events, filters]
                properties:
                  sessionId: { type: string, nullable: true, description: "null només si era una conversa nova i la resposta és `fallback` (no es crea cap sessió buida)" }
                  type: { type: string, enum: [text, plan, fallback] }
                  reply: { type: string }
                  events:
                    type: array
                    description: Targetes clicables dels esdeveniments que esmenta la resposta (màxim 3). Buida a les respostes `plan`, perquè els passos ja porten les dades.
                    items: { $ref: '#/components/schemas/Event' }
                  filters:
                    type: object
                    nullable: true
                    description: |
                      Filtres que el xatbot ha interpretat del missatge, perquè l'app els mostri.
                      null si no n'ha interpretat cap o si l'extracció ha fallat. Demanar un itinerari
                      no compta com a filtre: "fes-me un itinerari" sense data, lloc ni cap altre criteri
                      dona null. Si hi ha altres filtres, `itinerary` és true quan s'ha demanat un itinerari.
                    properties:
                      from: { type: string, format: date-time, nullable: true }
                      to: { type: string, format: date-time, nullable: true }
                      timeOfDay: { type: string, nullable: true, example: tarda }
                      categories: { type: array, items: { type: string } }
                      audience: { type: string, nullable: true, example: infantil }
                      maxPrice: { type: number, nullable: true, description: "0 = només gratuïts" }
                      municipality: { type: string }
                      comarca: { type: string }
                      datePassed: { type: boolean }
                      itinerary: { type: boolean, description: "L'usuari ha demanat un itinerari" }
                  plan:
                    type: object
                    description: Només quan `type` és `plan`. Itinerari d'un sol dia.
                    required: [date, steps]
                    properties:
                      date: { type: string, format: date, example: "2026-11-21" }
                      steps:
                        type: array
                        minItems: 1
                        items:
                          type: object
                          required: [order, id, title, start, end, venue, address, municipality, coordinates, distanceKm, travelMinutes, url]
                          properties:
                            order: { type: integer, minimum: 1 }
                            id: { type: string, nullable: true, description: "Identificador de l'esdeveniment (GET /events/{id})" }
                            title: { type: string }
                            start: { type: string, format: date-time, description: "Inici del pas (hora local)" }
                            end: { type: string, format: date-time, description: "Final del pas. En exposicions i fires, una visita d'1,5 h." }
                            venue: { type: string }
                            address: { type: string }
                            municipality: { type: string }
                            coordinates:
                              type: array
                              nullable: true
                              items: { type: number }
                              minItems: 2
                              maxItems: 2
                              description: "[longitud, latitud]; null si l'esdeveniment no en té"
                            distanceKm: { type: number, nullable: true, description: "Distància des del pas anterior; null al primer pas o sense coordenades" }
                            travelMinutes: { type: integer, nullable: true, description: "Desplaçament estimat des del pas anterior" }
                            url: { type: string }
              example:
                sessionId: "6710f1c2a1b2c3d4e5f60718"
                type: plan
                events: []
                filters:
                  from: "2026-11-21T10:30:00+01:00"
                  to: "2026-11-21T23:59:59+01:00"
                  timeOfDay: null
                  categories: []
                  audience: null
                  maxPrice: null
                  municipality: Girona
                  itinerary: true
                reply: "Aquí tens un itinerari de 2 passos per al 21/11:\n1. 10:30–12:00 · Visita guiada al Call (Girona)\n2. 12:30–13:30 · Concert vermut (Girona)"
                plan:
                  date: "2026-11-21"
                  steps:
                    - { order: 1, id: "6710f1c2a1b2c3d4e5f60718", title: "Visita guiada al Call", start: "2026-11-21T10:30:00+01:00", end: "2026-11-21T12:00:00+01:00", venue: "Call jueu", address: "", municipality: "Girona", coordinates: [2.8259, 41.9875], distanceKm: null, travelMinutes: null, url: "" }
                    - { order: 2, id: "6710f1c2a1b2c3d4e5f60719", title: "Concert vermut", start: "2026-11-21T12:30:00+01:00", end: "2026-11-21T13:30:00+01:00", venue: "", address: "", municipality: "Girona", coordinates: [2.824, 41.9845], distanceKm: 0.4, travelMinutes: 2, url: "" }
        '400':
          description: |
            Petició no vàlida. No reintentar: cal corregir el missatge.
            Codis: `INVALID_BODY`, `MESSAGE_REQUIRED`, `MESSAGE_TOO_LONG`, `INVALID_SESSION_ID`, `INVALID_LOCALE`.
            Un cos que no és JSON vàlid també dona 400, però és un error comú de l'API: `{ error: "JSON no vàlid" }`
            sense `code` (esquema `Error`).
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/ChatError' }
                  - { $ref: '#/components/schemas/Error' }
              example: { error: 'Camp "message" massa llarg (màxim 500 caràcters)', code: MESSAGE_TOO_LONG }
        '401':
          description: Cal autenticació (error comú de l'API, sense `code`). Cal tornar a iniciar sessió.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: |
            Sessió de xat no trobada o d'una altra persona (`SESSION_NOT_FOUND`). Es pot començar
            una conversa nova enviant el missatge sense `sessionId`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatError' }
              example: { error: Sessió de xat no trobada, code: SESSION_NOT_FOUND }
        '429':
          description: |
            Límit de missatges assolit, 10 per minut i usuari (`RATE_LIMITED`). Es pot reintentar quan
            ho indiqui la capçalera `Retry-After` (en segons); també s'envien `RateLimit` i `RateLimit-Policy`.
          headers:
            Retry-After:
              description: Segons que cal esperar abans de tornar-ho a provar.
              schema: { type: integer, example: 60 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatError' }
              example: { error: Has arribat al límit de missatges; torna-ho a provar més tard, code: RATE_LIMITED }
        '413':
          description: |
            Petició massa gran (límit de 100 kB de `express.json`). Error comú de l'API, sense `code`:
            `{ error: "Petició massa gran" }`. No reintentar.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502':
          description: |
            El servei de xatbot ha fallat o ha donat una resposta no vàlida
            (`CHATBOT_ERROR`, `CHATBOT_INVALID_RESPONSE`). Es pot reintentar.
            Qualsevol error inesperat del servei de xatbot (p. ex. un 4xx intern) arriba com a 502 `CHATBOT_ERROR`:
            els altres estats d'aquesta llista només tenen els codis que s'hi indiquen.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatError' }
              example: { error: El servei de xatbot ha fallat, code: CHATBOT_ERROR }
        '503':
          description: |
            Servei no disponible: el xatbot (`CHATBOT_UNAVAILABLE`) o la base d'esdeveniments
            (`EVENTS_UNAVAILABLE`). Es pot reintentar més tard.
            Si només falla el model d'IA, la resposta no és aquest error sinó un 200 amb `type: fallback`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatError' }
              example: { error: El servei d'esdeveniments no està disponible, code: EVENTS_UNAVAILABLE }
        '504':
          description: El servei de xatbot ha tardat massa a respondre (`CHATBOT_TIMEOUT`, després de `PYTHON_TIMEOUT_MS`). Es pot reintentar.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatError' }
              example: { error: El servei de xatbot ha tardat massa a respondre, code: CHATBOT_TIMEOUT }
        '500':
          description: Error intern en la configuració o la persistència (error comú de l'API, sense `code`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /users/me/preferences:
    get:
      summary: Preferències culturals i radi d'activitat de l'usuari autenticat
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Preferences' }
        '401':
          description: Cal autenticació
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    put:
      summary: Substitueix les preferències i, opcionalment, el radi d'activitat
      description: |
        `preferences` substitueix la llista sencera. Han de ser categories de /events/categories
        (no distingeix majúscules ni accents) i es treuen els duplicats.
        `proximitatKm` és opcional: si no s'envia, es manté el valor actual; `null` l'esborra.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [preferences]
              additionalProperties: false
              properties:
                preferences:
                  type: array
                  maxItems: 30
                  items: { type: string, minLength: 1, maxLength: 50 }
                  example: ["Música", "Teatre"]
                proximitatKm: { type: number, nullable: true, minimum: 0.1, maximum: 500, example: 10 }
      responses:
        '200':
          description: Preferències desades
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Preferences' }
        '400':
          description: Camps o valors no vàlids (p. ex. categoria desconeguda o proximitatKm fora de rang)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Cal autenticació
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /events:
    get:
      summary: Llista d'esdeveniments (amb filtres i paginació)
      description: |
        Per defecte retorna els esdeveniments que encara no han acabat, ordenats per data d'inici.
        Si s'envien lat i lng, s'ordenen per distància i cada resultat inclou "distanceMeters".
        Amb una sessió vàlida, cada resultat inclou isFavorite per a l'usuari autenticat.
        Si no s'envia Authorization, la llista és pública i omet el camp.
      security:
        - bearerAuth: []
        - {}
      parameters:
        - { name: q, in: query, schema: { type: string }, description: "Text lliure: títol, lloc, municipi o etiqueta" }
        - { name: category, in: query, schema: { type: string }, description: "Una o més categories separades per coma (vegeu /events/categories)", example: "Música,Teatre" }
        - { name: tag, in: query, schema: { type: string }, description: "Una o més etiquetes separades per coma" }
        - { name: comarca, in: query, schema: { type: string } }
        - { name: municipality, in: query, schema: { type: string } }
        - { name: price, in: query, schema: { type: string, enum: [free, paid] }, description: "Filtra per preu: 'free' per a esdeveniments gratuïts (preu 0) o 'paid' per a esdeveniments de pagament (preu > 0)" }
        - { name: from, in: query, schema: { type: string, format: date-time }, description: "Inici de l'interval. Per defecte, ara." }
        - { name: to, in: query, schema: { type: string, format: date-time }, description: "Final de l'interval" }
        - { name: lat, in: query, schema: { type: number, minimum: -90, maximum: 90 }, description: "Requereix lng" }
        - { name: lng, in: query, schema: { type: number, minimum: -180, maximum: 180 }, description: "Requereix lat" }
        - { name: radiusKm, in: query, schema: { type: number, minimum: 0.1, maximum: 500 }, description: "Radi en km. Requereix lat i lng." }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Pàgina d'esdeveniments
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Event' }
                  page: { type: integer }
                  limit: { type: integer }
                  total: { type: integer, description: "Total d'esdeveniments que compleixen el filtre" }
        '400':
          description: Paràmetre invàlid
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Credencial invàlida o sessió revocada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /events/categories:
    get:
      summary: Categories disponibles per al filtre
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  categories:
                    type: array
                    items: { type: string }
                    example: ["Música", "Teatre", "Gastronomia"]

  /events/locations:
    get:
      summary: Comarques i municipis amb esdeveniments disponibles
      description: Parelles úniques, sense camps buits si tots dos són desconeguts. Independent dels filtres de cerca.
      responses:
        '200':
          description: Catàleg de localitats, pot ser buit
          content:
            application/json:
              schema:
                type: object
                required: [locations]
                properties:
                  locations:
                    type: array
                    items:
                      type: object
                      required: [comarca, municipality]
                      properties:
                        comarca: { type: string }
                        municipality: { type: string }
        '500':
          description: Error intern del servidor

  /events/{id}:
    get:
      summary: Detall d'un esdeveniment
      description: |
        Amb una sessió vàlida, inclou isFavorite per a l'usuari autenticat.
        Si no s'envia Authorization, la fitxa és pública i omet el camp.
      security:
        - bearerAuth: []
        - {}
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '404':
          description: No trobat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Credencial invàlida o sessió revocada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /users/me/attended:
    get:
      summary: Consulta els esdeveniments acabats als quals ha assistit l'usuari autenticat
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Llista del més recent al més antic segons la data de finalització. Pot ser buida.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Event' }
        '401':
          description: Cal una sessió vàlida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: Error intern del servidor
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /users/me/activity:
    get:
      summary: Consulta les assistències de l'usuari autenticat
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Llista del més recent al més antic. Pot ser buida.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, event, attendedAt]
                      properties:
                        id: { type: string }
                        event: { $ref: '#/components/schemas/Event' }
                        attendedAt: { type: string, format: date-time, description: Data del registre de l'assistència }
        '401':
          description: Cal una sessió vàlida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: Error intern del servidor
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /users/me/favorites:
    get:
      summary: Consulta els preferits de l'usuari autenticat
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Llista del més recent al més antic. Pot ser buida.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      allOf:
                        - { $ref: '#/components/schemas/Event' }
                        - type: object
                          required: [notificacionsActives]
                          properties:
                            notificacionsActives: { type: boolean, description: Alertes del preferit activades }
        '401':
          description: Cal una sessió vàlida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: Error intern del servidor
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      summary: Desa un esdeveniment als preferits de l'usuari autenticat
      description: |
        L'operació és idempotent. Repetir-la amb el mateix esdeveniment
        retorna 204 i conserva el preferit existent.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventId]
              properties:
                eventId:
                  type: string
                  pattern: '^[0-9A-Fa-f]{24}$'
                  example: "6710f1c2a1b2c3d4e5f60718"
      responses:
        '204':
          description: Esdeveniment desat o ja present als preferits
        '400':
          description: Cos de la petició o identificador d'esdeveniment invàlid
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Credencial absent, invàlida o sessió revocada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Esdeveniment no trobat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: Error intern del servidor
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /ext/v1/events:
    get:
      summary: Agenda per dates i zona per a altres equips (p. ex. Xematrip)
      description: |
        API de només lectura per a clients externs. Cal la clau pròpia del client a la capçalera `X-API-Key`.
        Cal indicar UNA sola zona: una `comarca`, o bé `lat` + `lng` + `radiusKm`.
        Si és per radi, els resultats van ordenats per distància; si no, per data d'inici.
        Només hi ha esdeveniments dels pròxims 7 dies (la ingesta diària no en guarda més).
        Només inclou dades reals: els esdeveniments de prova (seed) només surten a l'entorn de desenvolupament.
        Qualsevol altre paràmetre es rebutja amb 400. No inclou cap dada personal d'usuaris.
      security:
        - apiKeyAuth: []
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time }, description: "Inici del rang. Per defecte, ara.", example: "2026-12-26T00:00:00+01:00" }
        - { name: to, in: query, schema: { type: string, format: date-time }, description: "Final del rang", example: "2026-12-28T23:59:59+01:00" }
        - { name: comarca, in: query, schema: { type: string }, description: "Una sola comarca, no buida (no distingeix majúscules ni accents). No es pot combinar amb lat/lng/radiusKm.", example: "Gironès" }
        - { name: lat, in: query, schema: { type: number, minimum: -90, maximum: 90 }, description: "Requereix lng i radiusKm" }
        - { name: lng, in: query, schema: { type: number, minimum: -180, maximum: 180 }, description: "Requereix lat i radiusKm" }
        - { name: radiusKm, in: query, schema: { type: number, minimum: 0.1, maximum: 500 }, description: "Radi en km al voltant de (lat, lng). Requereix lat i lng." }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Pàgina d'esdeveniments
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ExternalEvent' }
                  page: { type: integer }
                  limit: { type: integer }
                  total: { type: integer, description: "Total d'esdeveniments que compleixen el filtre" }
              example:
                items:
                  - title: Concert de Sant Esteve
                    startDate: "2026-12-26T18:00:00.000Z"
                    endDate: "2026-12-26T20:00:00.000Z"
                    schedule: "19 h"
                    location:
                      address: "C. Major, 1"
                      municipality: Girona
                      comarca: Gironès
                      coordinates: [2.82, 41.98]
                    tags: [música, nadal]
                    url: "https://agenda.cultura.gencat.cat/concert"
                page: 1
                limit: 20
                total: 1
        '400':
          description: Paràmetre no vàlid o no admès, sense zona, amb dues zones o amb una comarca buida o múltiple
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Falta la clau X-API-Key o no és vàlida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: API externa no disponible (configuració de claus incorrecta al servidor)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /users/me/favorites/{eventId}:
    patch:
      summary: Activa o silencia les alertes d’un preferit propi
      security:
        - bearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9A-Fa-f]{24}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [notificacionsActives]
              properties:
                notificacionsActives: { type: boolean }
      responses:
        '204':
          description: Preferència desada
        '400':
          description: Identificador o cos de la petició invàlid
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Cal una sessió vàlida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Preferit propi no trobat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: Error intern del servidor
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

    delete:
      summary: Elimina un esdeveniment dels preferits de l'usuari autenticat
      description: |
        És idempotent. Retorna 204 també si no hi ha cap preferit per a aquest
        identificador.
      security:
        - bearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9A-Fa-f]{24}$'
      responses:
        '204':
          description: El preferit ja no és a la llista
        '400':
          description: Identificador d'esdeveniment invàlid
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Credencial absent, invàlida o sessió revocada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: Error intern del servidor
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Clau pròpia de cada client extern (altres equips de PES). La facilita l'equip de Caliu.
  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
    ChatError:
      type: object
      description: |
        Error de `POST /chat/messages` (#143). `error` és un missatge per mostrar a l'usuari i `code` un
        identificador estable perquè l'app decideixi què fer sense dependre del text.

        | Codi | HTTP | Reintentar? |
        |------|------|-------------|
        | `INVALID_BODY` | 400 | No: el cos té camps no admesos |
        | `MESSAGE_REQUIRED` | 400 | No: cal escriure un missatge |
        | `MESSAGE_TOO_LONG` | 400 | No: màxim 500 caràcters |
        | `INVALID_SESSION_ID` | 400 | No: `sessionId` mal format |
        | `INVALID_LOCALE` | 400 | No: `locale` ha de ser `ca`, `es` o `en` |
        | `SESSION_NOT_FOUND` | 404 | No: començar una sessió nova |
        | `RATE_LIMITED` | 429 | Sí, més tard |
        | `CHATBOT_ERROR` | 502 | Sí |
        | `CHATBOT_INVALID_RESPONSE` | 502 | Sí |
        | `CHATBOT_UNAVAILABLE` | 503 | Sí, més tard |
        | `EVENTS_UNAVAILABLE` | 503 | Sí, més tard |
        | `CHATBOT_TIMEOUT` | 504 | Sí |

        Cap d'aquests errors desa el missatge a l'historial: reintentar no el duplica.
      required: [error, code]
      properties:
        error: { type: string }
        code:
          type: string
          enum: [INVALID_BODY, MESSAGE_REQUIRED, MESSAGE_TOO_LONG, INVALID_SESSION_ID, INVALID_LOCALE, SESSION_NOT_FOUND, RATE_LIMITED, CHATBOT_ERROR, CHATBOT_INVALID_RESPONSE, CHATBOT_UNAVAILABLE, EVENTS_UNAVAILABLE, CHATBOT_TIMEOUT]
    Preferences:
      type: object
      required: [preferences, proximitatKm]
      properties:
        preferences:
          type: array
          items: { type: string }
          example: ["Música", "Teatre"]
        proximitatKm:
          type: number
          nullable: true
          minimum: 0.1
          maximum: 500
          description: "Radi d'activitat en km (mateixos límits que radiusKm de GET /events). null si l'usuari no n'ha triat cap."
          example: 10
    Event:
      type: object
      properties:
        id: { type: string, example: "6710f1c2a1b2c3d4e5f60718" }
        code: { type: string, example: "seed-001" }
        title: { type: string }
        description: { type: string }
        startDate: { type: string, format: date-time }
        endDate: { type: string, format: date-time }
        schedule: { type: string }
        venue: { type: string }
        address: { type: string }
        municipality: { type: string }
        comarca: { type: string }
        location:
          type: object
          description: "Pot faltar si l'esdeveniment no té coordenades"
          properties:
            type: { type: string, enum: [Point] }
            coordinates:
              type: array
              items: { type: number }
              minItems: 2
              maxItems: 2
              example: [2.1734, 41.3851]
        categories: { type: array, items: { type: string } }
        tags: { type: array, items: { type: string } }
        price: { type: number, description: "0 = gratuït. Pot faltar si es desconeix." }
        url: { type: string }
        images: { type: array, items: { type: string } }
        email: { type: string }
        phone: { type: string }
        source: { type: string, description: "ingest = dades reals, seed = dades de prova" }
        isFavorite:
          type: boolean
          description: Indica si l'usuari autenticat ha desat l'esdeveniment. Es retorna a GET /events i GET /events/{id} amb sessió vàlida, i a GET /users/me/favorites és sempre true.
        distanceMeters: { type: integer, description: "Només present si s'han enviat lat i lng" }
    ExternalEvent:
      type: object
      description: "Esdeveniment per a clients externs (contracte amb Xematrip). Tots els camps hi són sempre."
      required: [title, startDate, endDate, schedule, location, tags, url]
      properties:
        title: { type: string, example: "Concert de Sant Esteve" }
        startDate: { type: string, format: date-time }
        endDate: { type: string, format: date-time, nullable: true }
        schedule: { type: string, description: "Horari en text lliure; buit si es desconeix", example: "19 h" }
        location:
          type: object
          required: [address, municipality, comarca, coordinates]
          properties:
            address: { type: string, example: "C. Major, 1" }
            municipality: { type: string, example: "Girona" }
            comarca: { type: string, example: "Gironès" }
            coordinates:
              type: array
              nullable: true
              description: "[longitud, latitud] (GeoJSON). null si l'esdeveniment no té coordenades."
              items: { type: number }
              minItems: 2
              maxItems: 2
              example: [2.82, 41.98]
        tags: { type: array, items: { type: string }, example: ["música", "nadal"] }
        url: { type: string, description: "Enllaç a la pàgina oficial; buit si no n'hi ha" }
