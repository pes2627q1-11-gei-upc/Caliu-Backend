openapi: 3.0.3
info:
  title: Caliu API
  version: 0.1.0
  description: |
    API REST de Caliu (api-node). Contracte compartit amb el frontend.
    - Les dates són ISO 8601 (si envieu zona horària, p. ex. +02:00, el filtre és exacte).
    - Les coordenades van en ordre [longitud, latitud] (GeoJSON).
    - Tots els errors tenen el format { "error": "missatge" }.
servers:
  - url: http://localhost:3000
    description: "Local (Docker Compose). Des de l'emulador Android: http://10.0.2.2:3000"

paths:
  /auth/register:
    post:
      summary: "#39 Registra un compte amb email i password"
      description: Normalitza el correu amb trim i minúscules. No inicia sessió automàticament.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
            example: { email: persona@example.cat, password: Exemple-password-42 }
      responses:
        '201':
          description: Compte creat
          content:
            application/json:
              schema:
                type: object
                required: [user]
                additionalProperties: false
                properties:
                  user: { $ref: '#/components/schemas/User' }
              example:
                user: { id: '6710f1c2a1b2c3d4e5f60718', email: persona@example.cat, username: null, preferences: [] }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '409': { $ref: '#/components/responses/EmailConflict' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '500': { $ref: '#/components/responses/InternalError' }

  /auth/login:
    post:
      summary: "#40 Inicia sessió"
      description: |
        Retorna JWT HS256 amb expiració (JWT_TTL_SECONDS, per defecte 3600 segons).
        Les credencials mal formades retornen 400; un correu inexistent o password
        incorrecte de format vàlid retornen el mateix 401. Cache-Control és no-store.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
            example: { email: persona@example.cat, password: Exemple-password-42 }
      responses:
        '200':
          description: Sessió iniciada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
              example:
                user: { id: '6710f1c2a1b2c3d4e5f60718', email: persona@example.cat, username: null, preferences: [] }
                token: '<access-token>'
                tokenType: Bearer
                expiresIn: 3600
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401':
          description: Credencials incorrectes (mateix error per compte inexistent o password erroni)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: Credencials incorrectes }
        '413': { $ref: '#/components/responses/TooLarge' }
        '500': { $ref: '#/components/responses/InternalError' }

  /auth/logout:
    post:
      summary: "#38 Tanca totes les sessions de l'usuari"
      description: |
        Incrementa tokenVersion a MongoDB i invalida TOTS els JWT previs del compte.
        Conserva perfil i preferències. El client ha d'eliminar el token del seu emmagatzematge.
        No requereix cos. Reutilitzar el token després del logout retorna 401.
        No cancel·la peticions que ja s'hagin completat o lectures en curs.
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Sessions invalidades; sense cos de resposta }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '500': { $ref: '#/components/responses/InternalError' }

  /users/me:
    get:
      summary: "#34 Consulta el perfil propi"
      description: El subject del JWT determina l'usuari; no accepta cap identificador de perfil del client.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Perfil públic propi (Cache-Control no-store)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
              example: { id: '6710f1c2a1b2c3d4e5f60718', email: persona@example.cat, username: Nuria_42, preferences: [Música, Cinema] }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      summary: "#34 Modifica el username propi"
      description: |
        Només permet username. Qualsevol camp addicional (email, password, role, id,
        tokenVersion, preferences...) retorna 400. El username no és únic provisionalment,
        pendent de Cultura't. Aplica trim i normalització Unicode NFC.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileUpdate' }
            example: { username: Nuria_42 }
      responses:
        '200':
          description: Perfil actualitzat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
              example: { id: '6710f1c2a1b2c3d4e5f60718', email: persona@example.cat, username: Nuria_42, preferences: [] }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '500': { $ref: '#/components/responses/InternalError' }

  /users/me/preferences:
    get:
      summary: "#37 Consulta les preferències pròpies"
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Preferències desades
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Preferences' }
              example: { preferences: [Música, Cinema] }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      summary: "#37 Substitueix totes les preferències pròpies"
      description: |
        Una llista buida elimina totes les preferències. Aplica trim i Unicode NFC,
        i elimina duplicats sense distingir majúscules (conserva la primera grafia).
        No restringeix a EVENT_CATEGORIES: el catàleg definitiu de #37 està pendent de Cultura't.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Preferences' }
            examples:
              selection: { value: { preferences: [Música, Cinema, Dansa] } }
              clear: { value: { preferences: [] } }
      responses:
        '200':
          description: Preferències substituïdes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Preferences' }
              example: { preferences: [Música, Cinema, Dansa] }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '500': { $ref: '#/components/responses/InternalError' }

  /health:
    get:
      summary: Comprova que el servei funciona
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  service: { type: string, example: api-node }

  /events:
    get:
      summary: Llista d'esdeveniments (amb filtres i paginació)
      description: |
        Per defecte retorna els esdeveniments que encara no han acabat, ordenats per data d'inici.
        Si s'envien lat i lng, s'ordenen per distància i cada resultat inclou "distanceMeters".
      parameters:
        - { name: q, in: query, schema: { type: string }, description: "Text lliure: títol, lloc, municipi o etiqueta" }
        - { name: category, in: query, schema: { type: string }, description: "Una o més categories separades per coma (vegeu /events/categories)", example: "Música,Teatre" }
        - { name: tag, in: query, schema: { type: string }, description: "Una o més etiquetes separades per coma" }
        - { name: comarca, in: query, schema: { type: string }, description: "Una o més comarques separades per coma. Nom complet, sense distingir majúscules ni accents.", example: "Gironès,Baix Ebre" }
        - { name: municipi, in: query, schema: { type: string }, description: "Un o més municipis separats per coma. Nom complet, sense distingir majúscules ni accents (\"Vilafranca del Penedes\" i \"Vilafranca del Penedès\" coincideixen).", example: "Girona,Salt" }
        - { name: municipality, in: query, deprecated: true, schema: { type: string }, description: "Àlies antic de \"municipi\"." }
        - { name: from, in: query, schema: { type: string, format: date-time }, description: "Inici de l'interval. Per defecte, ara." }
        - { name: to, in: query, schema: { type: string, format: date-time }, description: "Final de l'interval" }
        - { name: lat, in: query, schema: { type: number, minimum: -90, maximum: 90 }, description: "Requereix lng" }
        - { name: lng, in: query, schema: { type: number, minimum: -180, maximum: 180 }, description: "Requereix lat" }
        - { name: radiusKm, in: query, schema: { type: number, minimum: 0.1, maximum: 500 }, description: "Radi en km. Requereix lat i lng." }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Pàgina d'esdeveniments
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Event' }
                  page: { type: integer }
                  limit: { type: integer }
                  total: { type: integer, description: "Total d'esdeveniments que compleixen el filtre" }
        '400':
          description: Paràmetre invàlid
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /events/categories:
    get:
      summary: Categories disponibles per al filtre
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  categories:
                    type: array
                    items: { type: string }
                    example: ["Música", "Teatre", "Gastronomia"]

  /events/nearby:
    get:
      summary: Esdeveniments propers a una ubicació
      description: |
        Retorna els esdeveniments que encara no han acabat dins d'un radi al voltant de (lat, lng),
        ordenats de més a menys a prop. Cada resultat inclou "distanceMeters" (metres enters).
        Accepta els mateixos filtres i la mateixa paginació que GET /events (category, tag, comarca,
        municipi, from, to, page, limit). Si no s'envia radiusKm, s'usa un radi de 10 km.
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number, minimum: -90, maximum: 90 }, example: 41.3874 }
        - { name: lng, in: query, required: true, schema: { type: number, minimum: -180, maximum: 180 }, example: 2.1686 }
        - { name: radiusKm, in: query, schema: { type: number, minimum: 0.1, maximum: 500, default: 10 }, description: "Radi en km" }
        - { name: category, in: query, schema: { type: string }, description: "Una o més categories separades per coma" }
        - { name: from, in: query, schema: { type: string, format: date-time }, description: "Inici de l'interval. Per defecte, ara." }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Pàgina d'esdeveniments ordenats per distància
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      allOf:
                        - { $ref: '#/components/schemas/Event' }
                        - type: object
                          properties:
                            distanceMeters: { type: integer, example: 635 }
                  page: { type: integer }
                  limit: { type: integer }
                  total: { type: integer }
        '400':
          description: Falta lat o lng, o algun paràmetre és invàlid
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /events/{id}:
    get:
      summary: Detall d'un esdeveniment
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '404':
          description: No trobat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Authorization: Bearer <token>; HS256, issuer caliu-api, audience caliu-android"
  responses:
    InvalidInput:
      description: Camps obligatoris absents, tipus/format/longitud invàlids, camps desconeguts o JSON mal format
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: Camps de la petició no vàlids }
    Unauthenticated:
      description: Token absent, invàlid, expirat, revocat o usuari inexistent
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: Sessió no vàlida }
    EmailConflict:
      description: Correu normalitzat ja registrat
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: El correu ja està registrat }
    TooLarge:
      description: Cos JSON superior al límit d'Express (100 KiB)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: Petició massa gran }
    InternalError:
      description: Error intern de configuració o persistència; no inclou detalls interns
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: Error intern del servidor }
  schemas:
    Credentials:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Correu ASCII, part local de màxim 64 caràcters i domini amb punt. Aplica trim i minúscules.
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 8
          maxLength: 72
          description: Mínim 8 caràcters Unicode i màxim 72 BYTES UTF-8, sense controls ni només espais. No aplica trim.
    ProfileUpdate:
      type: object
      additionalProperties: false
      required: [username]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 30
          description: Després de trim i NFC, de 3 a 30 lletres Unicode, números, punts, guions o guions baixos. No únic provisionalment.
          example: Núria_42
    Preferences:
      type: object
      additionalProperties: false
      required: [preferences]
      properties:
        preferences:
          type: array
          maxItems: 30
          description: Text lliure sense enum; es deduplica després de trim, NFC i comparació sense majúscules. Admet [].
          items:
            type: string
            minLength: 1
            maxLength: 50
            description: Text no buit després de trim i NFC, sense controls Unicode Cc ni Cf.
    User:
      type: object
      additionalProperties: false
      required: [id, email, username, preferences]
      properties:
        id: { type: string, pattern: '^[a-fA-F0-9]{24}$', example: '6710f1c2a1b2c3d4e5f60718' }
        email: { type: string, format: email, example: persona@example.cat }
        username: { type: string, nullable: true, minLength: 3, maxLength: 30, example: Núria_42 }
        preferences:
          type: array
          maxItems: 30
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 50 }
    LoginResponse:
      type: object
      additionalProperties: false
      required: [user, token, tokenType, expiresIn]
      properties:
        user: { $ref: '#/components/schemas/User' }
        token: { type: string, description: JWT d'accés signat; mai incloure als logs }
        tokenType: { type: string, enum: [Bearer] }
        expiresIn: { type: integer, minimum: 1, maximum: 86400, example: 3600, description: Durada en segons des del login }
    Error:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error: { type: string }
    Event:
      type: object
      properties:
        id: { type: string, example: "6710f1c2a1b2c3d4e5f60718" }
        code: { type: string, example: "seed-001" }
        title: { type: string }
        description: { type: string }
        startDate: { type: string, format: date-time }
        endDate: { type: string, format: date-time }
        schedule: { type: string }
        venue: { type: string }
        address: { type: string }
        municipality: { type: string }
        comarca: { type: string }
        location:
          type: object
          description: "Pot faltar si l'esdeveniment no té coordenades"
          properties:
            type: { type: string, enum: [Point] }
            coordinates:
              type: array
              items: { type: number }
              minItems: 2
              maxItems: 2
              example: [2.1734, 41.3851]
        categories: { type: array, items: { type: string } }
        tags: { type: array, items: { type: string } }
        price: { type: number, description: "0 = gratuït. Pot faltar si es desconeix." }
        url: { type: string }
        images: { type: array, items: { type: string } }
        email: { type: string }
        phone: { type: string }
        source: { type: string, description: "ingest = dades reals, seed = dades de prova" }
        distanceMeters: { type: integer, description: "Només present si s'han enviat lat i lng" }
